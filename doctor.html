<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Doctor Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
        <h2>MedCare</h2>
        <ul>
            <li class="active" onclick="showSection('dashboard', this)">Dashboard</li>
            <li onclick="showSection('appointments', this)">Appointments</li>
            <li onclick="showSection('queries', this)">Queries</li>
            <li onclick="logout()">Logout</li>
        </ul>
    </aside>

    <!-- Main -->
    <main class="main">

        <!-- Dashboard Section -->
        <div id="dashboard" class="section active">
            <div class="card">
                <h3>Welcome to Doctor Dashboard</h3>
                <p>View patient appointments and queries.</p>
            </div>
        </div>

        <!-- Appointments Section -->
        <div id="appointments" class="section">
            <div class="card">
                <h4>Appointment Requests</h4>

                <table>
                    <thead>
                        <tr>
                            <th>Doctor</th>
                            <th>Date</th>
                        </tr>
                    </thead>
                    <tbody id="appointmentTable">
                        <!-- Filled by JS -->
                    </tbody>
                </table>

            </div>
        </div>

        <!-- Queries Section -->
        <div id="queries" class="section">
            <div class="card">
                <h4>Patient Queries</h4>

                <table>
                    <thead>
                        <tr>
                            <th>Subject</th>
                            <th>Description</th>
                        </tr>
                    </thead>
                    <tbody id="queryTable">
                        <!-- Filled by JS -->
                    </tbody>
                </table>

            </div>
        </div>

    </main>

</div>

<script src="script.js"></script>
</body>
</html>
